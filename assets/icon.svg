<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2820"/>
      <stop offset="1" stop-color="#14130d"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="230" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3628" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#14130d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cream" x1="130" y1="200" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf7ea"/>
      <stop offset="1" stop-color="#efe4cf"/>
    </linearGradient>
  </defs>

  <!-- Ink tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#ink)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Subtle inner hairline -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#e9c176" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Signature flourish -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 292 C188 206, 252 200, 276 250 C294 288, 260 306, 248 278 C237 253, 276 230, 322 244 C358 255, 376 288, 400 246"
          stroke="url(#cream)" stroke-width="17"/>
    <!-- gold underline swash with an upturned tail -->
    <path d="M126 336 C214 360, 322 360, 392 326 C404 320, 414 320, 420 308"
          stroke="#e9c176" stroke-width="9"/>
  </g>
  <!-- Ink nib accent at the stroke origin -->
  <circle cx="150" cy="292" r="8" fill="#e9c176"/>
</svg>
