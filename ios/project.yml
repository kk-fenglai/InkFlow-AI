name: InkFlowAI
options:
  bundleIdPrefix: com.inkflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  InkFlowAI:
    type: application
    platform: iOS
    sources:
      - path: InkFlowAI
        excludes:
          - "**/.DS_Store"
    resources:
      - path: InkFlowAI/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkflow.ai
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: InkFlow AI
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select photos for signature refinement."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: InkFlowAI/Info.plist
      properties:
        UILaunchScreen: {}

schemes:
  InkFlowAI:
    build:
      targets:
        InkFlowAI: all
    run:
      config: Debug
      storeKitConfiguration: InkFlowAI.storekit
    archive:
      config: Release
